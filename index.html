<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>貼心吃藥打卡</title>
<style>
  body { 
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
    text-align: center; 
    margin: 0; 
    padding: 0;
    background-color: #f4f7f6; 
    color: #333;
    -webkit-user-select: none;
    user-select: none;
    touch-action: manipulation;
  }

  .container { 
    width: 100%; 
    min-height: 100vh;
    box-sizing: border-box;
    background: white; 
    padding: env(safe-area-inset-top) 20px calc(env(safe-area-inset-bottom) + 20px) 20px;
    display: flex;
    flex-direction: column;
    position: relative;
  }

  h2 { margin-top: 20px; color: #222; font-size: 28px; font-weight: 800; margin-bottom: 5px; }
  
  .greeting-text {
    font-size: 24px;
    color: #e65100;
    font-weight: bold;
    margin-bottom: 20px;
  }

  .settings-toggle {
    position: absolute;
    top: max(20px, env(safe-area-inset-top));
    right: 20px;
    background: #e0e0e0;
    border: none;
    padding: 10px 16px;
    border-radius: 20px;
    cursor: pointer;
    font-weight: bold;
    font-size: 16px;
    color: #333;
  }

  .med-options { 
    display: flex; 
    justify-content: center; 
    gap: 15px; 
    margin: 15px 0 25px 0; 
    flex-wrap: wrap;
  }
  .med-btn { 
    padding: 14px 22px;
    border-radius: 24px; 
    border: 2px solid #eee; 
    background-color: #fafafa; 
    font-size: 20px; 
    font-weight: bold;
    cursor: pointer; 
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 8px;
    color: #555;
  }
  .med-btn.active { 
    background-color: #ff9800; 
    color: white; 
    border-color: #ff9800; 
    box-shadow: 0 6px 15px rgba(255, 152, 0, 0.3);
  }

  .notice-box {
    background-color: #fff8e1;
    border-left: 6px solid #ffb300;
    padding: 15px;
    margin: 15px 0;
    border-radius: 12px;
    text-align: left;
    font-size: 18px;
  }
  .notice-title { font-weight: bold; color: #b78103; margin-bottom: 6px; }

  .punch-container { flex-grow: 1; display: flex; justify-content: center; align-items: center; margin: 10px 0; }
  .punch-btn { 
    width: 220px; height: 220px; 
    border-radius: 50%; 
    background-color: #ff4d4d; 
    color: white; 
    font-size: 38px; 
    font-weight: 900; 
    border: none; 
    cursor: pointer; 
    box-shadow: 0 12px 30px rgba(255, 77, 77, 0.4); 
    transition: transform 0.1s;
    display: flex; justify-content: center; align-items: center;
  }
  .punch-btn:active { transform: scale(0.92); background-color: #e60000; }

  .status-box { 
    font-size: 20px; 
    text-align: left; 
    padding: 20px; 
    background: #f0f4f8; 
    border-radius: 20px; 
    line-height: 1.6;
    margin-bottom: 20px;
  }
  .alert { color: #d32f2f; font-weight: bold; display: block; margin-top: 10px; font-size: 22px; }
  .ok { color: #388e3c; font-weight: bold; display: block; margin-top: 10px; }

  .history-toggle-btn {
    width: 100%; padding: 16px; background: #e3f2fd; color: #1e88e5; border: 2px dashed #1e88e5; border-radius: 16px; font-size: 18px; font-weight: bold; cursor: pointer;
  }
  .history-log-box {
    margin-top: 15px; background: #fafafa; border: 1px solid #eee; border-radius: 16px; padding: 15px; text-align: left; max-height: 250px; overflow-y: auto; font-size: 18px;
  }
  .history-item { padding: 10px 0; border-bottom: 1px solid #eee; color: #444; }
  .history-item:last-child { border-bottom: none; }

  .hidden { display: none !important; }
  
  .setup-section { margin-top: 20px; padding-bottom: 25px; border-bottom: 2px dashed #eee; text-align: left; }
  .setup-form { text-align: left; margin-top: 40px; }
  .form-group { margin-bottom: 20px; }
  .form-group label { display: block; font-weight: bold; margin-bottom: 8px; font-size: 18px; }
  .form-group input, .form-group select { 
    width: 100%; padding: 15px; border-radius: 12px; border: 1px solid #ccc; font-size: 18px; box-sizing: border-box; background: #fff;
  }
  .action-btn {
    width: 100%; padding: 16px; background: #4CAF50; color: white; border: none; border-radius: 12px; font-size: 22px; font-weight: bold; cursor: pointer; margin-top: 15px;
  }
  .save-name-btn {
    background: #2196F3; color: white; border: none; border-radius: 12px; padding: 0 20px; font-size: 18px; font-weight: bold; cursor: pointer; white-space: nowrap;
  }
  
  .med-manager-list { margin-top: 30px; border-top: 2px solid #eee; padding-top: 20px; text-align: left; }
  .manager-item { 
    display: flex; justify-content: space-between; align-items: center; padding: 15px; background: #f9f9f9; border-radius: 12px; margin-bottom: 12px; font-size: 18px;
  }
  .delete-btn { background: #ff5252; color: white; border: none; padding: 10px 15px; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; }

  .training-box {
    margin-top: 30px; padding: 20px; background: #ffebee; border-radius: 16px; border: 2px dashed #ffcdd2; text-align: left;
  }
  .training-title { font-size: 20px; color: #c62828; font-weight: bold; margin-bottom: 10px; }
  .training-desc { font-size: 16px; color: #555; margin-bottom: 15px; line-height: 1.5; }
  .reset-btn { width: 100%; padding: 14px; background: #f44336; color: white; border: none; border-radius: 10px; font-size: 18px; font-weight: bold; cursor: pointer; }

  .modal-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.7);
    display: flex; justify-content: center; align-items: center;
    z-index: 1000;
  }
  .modal-content {
    background: white; padding: 40px 25px; border-radius: 30px;
    text-align: center; width: 85%; max-width: 400px;
    box-shadow: 0 15px 50px rgba(0,0,0,0.4);
    animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
  }
  @keyframes popIn {
    from { transform: scale(0.8); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  .modal-title { font-size: 32px; color: #4CAF50; font-weight: 900; margin-bottom: 15px; }
  .modal-subtitle { font-size: 22px; color: #555; margin-bottom: 10px; }
  .modal-time { font-size: 65px; color: #ff4d4d; font-weight: 900; margin-bottom: 30px; line-height: 1; }
  .close-modal-btn {
    background: #2196F3; color: white; border: none; padding: 18px;
    font-size: 24px; font-weight: bold; border-radius: 16px; cursor: pointer; width: 100%; margin-bottom: 15px;
  }
  .undo-modal-btn {
    background: #e0e0e0; color: #555; border: none; padding: 14px;
    font-size: 18px; font-weight: bold; border-radius: 12px; cursor: pointer; width: 100%;
  }
</style>
</head>
<body>

<div class="container">
  <div id="main-view" style="display:flex; flex-direction:column; height:100%;">
    <button class="settings-toggle" onclick="toggleView(true)">⚙️ 設定</button>
    
    <h2>💊 吃藥打卡小幫手</h2>
    <div class="greeting-text" id="main-greeting">☀️ 坤山 你好！</div>

    <div class="med-options" id="med-buttons-container"></div>

    <div class="notice-box">
      <div class="notice-title">💡 醫囑 / 注意事項：</div>
      <div id="med-notice">尚無注意事項</div>
    </div>

    <div class="punch-container">
      <button class="punch-btn" onclick="punchMedicine()">吃藥打卡</button>
    </div>

    <div class="status-box" id="status-container">
      尚無打卡紀錄。
    </div>

    <div>
      <button class="history-toggle-btn" onclick="toggleHistoryZone()">📊 查看最近 3 天紀錄</button>
      <div id="history-log-box" class="history-log-box hidden">
        <div id="history-list-items">暫無紀錄</div>
      </div>
    </div>
  </div>

  <div id="settings-view" class="hidden">
    <button class="settings-toggle" onclick="toggleView(false)">⬅️ 返回</button>
    <h2 style="margin-top: 40px;">⚙️ 系統後台設定</h2>
    
    <div class="setup-section">
      <div class="form-group" style="margin-bottom: 0;">
        <label>👤 使用者稱呼 (主畫面打招呼用)</label>
        <div style="display: flex; gap: 10px;">
          <input type="text" id="setting-user-name" placeholder="例如：坤山">
          <button class="save-name-btn" onclick="saveUserName()">儲存</button>
        </div>
      </div>
    </div>
    
    <div class="setup-form">
      <h3 style="margin-top: 0; margin-bottom: 15px; font-size: 20px;">➕ 新增追蹤藥品</h3>
      <div class="form-group">
        <label>藥品名稱</label>
        <input type="text" id="new-med-name" placeholder="例如：降血壓藥">
      </div>
      <div class="form-group">
        <label>藥丸標籤</label>
        <select id="new-med-icon">
          <option value="💊">💊 膠囊</option>
          <option value="🔴">🔴 紅色圓藥</option>
          <option value="🟡">🟡 黃色圓藥</option>
          <option value="⚪">⚪ 白色圓片</option>
          <option value="🟩">🟩 綠色方片</option>
          <option value="💧">💧 藥水</option>
        </select>
      </div>
      
      <div class="form-group">
        <label>吃藥頻率 / 每日次數</label>
        <select id="new-med-interval">
          <option value="24">一天吃 1 次 (固定時間，間隔 24 小時)</option>
          <option value="12">一天吃 2 次 (早晚，間隔 12 小時)</option>
          <option value="5" selected>一天吃 3 次 (隨三餐，間隔 5 小時)</option>
          <option value="4">一天吃 4 次 (三餐+睡前，間隔 4 小時)</option>
          <option disabled>──────────────</option>
          <option value="4">每 4 小時吃一次 (嚴格時效藥)</option>
          <option value="5">每 5 小時吃一次</option>
          <option value="6">每 6 小時吃一次</option>
          <option value="8">每 8 小時吃一次</option>
        </select>
      </div>
      
      <div class="form-group">
        <label>備註事項</label>
        <input type="text" id="new-med-notice" placeholder="例如：飯後吃、不可空腹">
      </div>
      <button class="action-btn" onclick="addMedication()">新增藥品</button>
    </div>

    <div class="training-box">
      <div class="training-title">🛠️ 教學模式 / 重新開始</div>
      <div class="training-desc">把手機交給長輩練習打卡，練習完畢後點擊下方按鈕，即可將目前選擇的藥品紀錄全部清空。</div>
      <button class="reset-btn" onclick="clearTrainingData()">🧹 清除「當前藥品」打卡紀錄</button>
    </div>

    <div class="med-manager-list">
      <h3 style="margin-bottom: 15px; font-size: 20px;">追蹤中的藥品清單：</h3>
      <div id="manager-items-container"></div>
    </div>
  </div>
</div>

<div id="punch-modal" class="modal-overlay hidden">
  <div class="modal-content">
    <div class="modal-title">✅ 打卡成功！</div>
    <div class="modal-subtitle">下一次吃藥時間：</div>
    <div class="modal-time" id="modal-next-time">18:00</div>
    <button class="close-modal-btn" onclick="closeModal()">我知道了</button>
    <button class="undo-modal-btn" onclick="undoLastPunch()">❌ 按錯了（取消）</button>
  </div>
</div>

<script>
  const defaultMedications = [
    { name: '感冒藥', interval: 5, notice: '一天吃3次，飯後服用，不可空腹。', icon: '💊' },
    { name: '血壓藥', interval: 24, notice: '一天吃1次，每天早上固定吃。', icon: '🔴' }
  ];

  let medications = [];
  let currentMedName = '';
  let showHistory = false;
  let userName = '坤山';

  function playDingSound() {
    try {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (!AudioContext) return;
      const ctx = new AudioContext();
      const osc1 = ctx.createOscillator();
      const gain1 = ctx.createGain();
      osc1.type = 'sine'; osc1.frequency.setValueAtTime(880, ctx.currentTime);
      gain1.gain.setValueAtTime(0.1, ctx.currentTime);
      gain1.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.15);
      osc1.connect(gain1); gain1.connect(ctx.destination);
      osc1.start(); osc1.stop(ctx.currentTime + 0.15);

      setTimeout(() => {
        const osc2 = ctx.createOscillator();
        const gain2 = ctx.createGain();
        osc2.type = 'sine'; osc2.frequency.setValueAtTime(1318.5, ctx.currentTime);
        gain2.gain.setValueAtTime(0.1, ctx.currentTime);
        gain2.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
        osc2.connect(gain2); gain2.connect(ctx.destination);
        osc2.start(); osc2.stop(ctx.currentTime + 0.3);
      }, 100);
    } catch (e) { console.log(e); }
  }

  function initSystem() {
    const storedName = localStorage.getItem('med_user_name');
    if (storedName) userName = storedName;
    document.getElementById('setting-user-name').value = userName;
    updateGreetingDisplay();

    const storedMeds = localStorage.getItem('user_medications');
    if (storedMeds) {
      medications = JSON.parse(storedMeds);
    } else {
      medications = defaultMedications;
      localStorage.setItem('user_medications', JSON.stringify(medications));
    }
    if (medications.length > 0 && !currentMedName) currentMedName = medications[0].name;
    
    renderMainButtons(); renderManagerList(); updateStatusDisplay();
  }

  function updateGreetingDisplay() {
    document.getElementById('main-greeting').innerText = `☀️ ${userName} 你好！`;
  }

  document.getElementById('setting-user-name') && saveUserName;
  function saveUserName() {
    const newName = document.getElementById('setting-user-name').value.trim();
    if (!newName) { alert("名字不能空白喔！"); return; }
    userName = newName;
    localStorage.setItem('med_user_name', userName);
    updateGreetingDisplay();
    alert(`✅ 稱呼已成功更新為「${userName}」！`);
  }

  function toggleView(showSettings) {
    if (showSettings) {
      const pwd = prompt("🔐 進入後台請輸入密碼：");
      if (pwd !== "8855") {
        if (pwd !== null) alert("❌ 密碼錯誤，無法進入設定喔！");
        return; 
      }
      document.getElementById('main-view').classList.add('hidden');
      document.getElementById('settings-view').classList.remove('hidden');
    } else {
      document.getElementById('settings-view').classList.add('hidden');
      document.getElementById('main-view').classList.remove('hidden');
      updateStatusDisplay();
    }
  }

  function renderMainButtons() {
    const container = document.getElementById('med-buttons-container');
    container.innerHTML = '';
    medications.forEach(med => {
      const btn = document.createElement('button');
      btn.className = `med-btn ${med.name === currentMedName ? 'active' : ''}`;
      btn.innerHTML = `<span>${med.icon || '💊'}</span> ${med.name}`;
      btn.onclick = () => selectMed(med.name);
      container.appendChild(btn);
    });
  }

  // 🌟 更新顯示轉換，完美匹配後台新增的項目
  function getFrequencyText(interval) {
    if (interval === 24) return '一天 1 次 (24小時)';
    if (interval === 12) return '一天 2 次 (12小時)';
    if (interval === 5) return '每 5 小時一次 / 一天 3 次';
    if (interval === 4) return '每 4 小時一次 / 一天 4 次';
    if (interval === 6) return '每 6 小時一次';
    if (interval === 8) return '每 8 小時一次';
    return `每 ${interval} 小時一次`;
  }

  function renderManagerList() {
    const container = document.getElementById('manager-items-container');
    container.innerHTML = '';
    medications.forEach((med, index) => {
      const item = document.createElement('div');
      item.className = 'manager-item';
      item.innerHTML = `
        <div>
          <strong>${med.icon || '💊'} ${med.name}</strong> (${getFrequencyText(med.interval)})<br>
          <span style="font-size:15px; color:#666;">📝 ${med.notice || '無備註'}</span>
        </div>
        <button class="delete-btn" onclick="deleteMedication(${index})">刪除</button>
      `;
      container.appendChild(item);
    });
  }

  function addMedication() {
    const nameInput = document.getElementById('new-med-name');
    const iconSelect = document.getElementById('new-med-icon');
    const intervalSelect = document.getElementById('new-med-interval');
    const noticeInput = document.getElementById('new-med-notice');
    const name = nameInput.value.trim(); const icon = iconSelect.value;
    const interval = parseInt(intervalSelect.value); const notice = noticeInput.value.trim();
    
    if (!name) { alert('請輸入藥品名稱喔！'); return; }
    if (medications.some(m => m.name === name)) { alert('名稱已存在囉！'); return; }
    
    medications.push({ name, interval, notice, icon });
    localStorage.setItem('user_medications', JSON.stringify(medications));
    nameInput.value = ''; noticeInput.value = ''; currentMedName = name; 
    renderMainButtons(); renderManagerList();
    alert(`成功新增「${name}」！`);
  }

  function deleteMedication(index) {
    const removedName = medications[index].name;
    if (confirm(`確定要刪除「${removedName}」嗎？紀錄也會不見喔。`)) {
      localStorage.removeItem('med_history_arr_' + removedName);
      medications.splice(index, 1);
      localStorage.setItem('user_medications', JSON.stringify(medications));
      if (currentMedName === removedName) currentMedName = medications.length > 0 ? medications[0].name : '';
      renderMainButtons(); renderManagerList();
    }
  }

  function clearTrainingData() {
    if (!currentMedName) { alert("目前沒有選擇任何藥品喔！"); return; }
    if (confirm(`確定要清除【${currentMedName}】目前所有的打卡紀錄嗎？\n教學完畢後可以用這個按鈕重新開始。`)) {
      localStorage.removeItem('med_history_arr_' + currentMedName);
      alert(`✅ 已經清空【${currentMedName}】的所有紀錄，系統像新的一樣囉！`);
      if (showHistory) renderHistoryList();
    }
  }

  function selectMed(medName) {
    currentMedName = medName;
    document.querySelectorAll('.med-btn').forEach(btn => {
      btn.classList.remove('active');
      if (btn.textContent.includes(medName)) btn.classList.add('active');
    });
    updateStatusDisplay();
  }

  function punchMedicine() {
    if (!currentMedName) { alert('請先到後台新增藥品喔！'); return; }
    playDingSound();
    
    const now = new Date(); const timestamp = now.getTime();
    let historyArr = [];
    const savedHistory = localStorage.getItem('med_history_arr_' + currentMedName);
    if (savedHistory) historyArr = JSON.parse(savedHistory);
    
    historyArr.push(timestamp);
    localStorage.setItem('med_history_arr_' + currentMedName, JSON.stringify(historyArr));
    
    const currentMed = medications.find(m => m.name === currentMedName);
    const nextTime = new Date(timestamp + currentMed.interval * 60 * 60 * 1000);
    document.getElementById('modal-next-time').innerText = nextTime.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
    document.getElementById('punch-modal').classList.remove('hidden');
    updateStatusDisplay();
  }

  function undoLastPunch() {
    const savedHistory = localStorage.getItem('med_history_arr_' + currentMedName);
    if (savedHistory) {
      let historyArr = JSON.parse(savedHistory);
      if (historyArr.length > 0) {
        historyArr.pop();
        localStorage.setItem('med_history_arr_' + currentMedName, JSON.stringify(historyArr));
      }
    }
    closeModal(); updateStatusDisplay();
    alert('已成功撤銷剛剛的打卡！');
  }

  function closeModal() { document.getElementById('punch-modal').classList.add('hidden'); }

  function toggleHistoryZone() {
    showHistory = !showHistory;
    const box = document.getElementById('history-log-box');
    if (showHistory) { box.classList.remove('hidden'); renderHistoryList(); } 
    else { box.classList.add('hidden'); }
  }

  function renderHistoryList() {
    const itemsContainer = document.getElementById('history-list-items');
    if (!currentMedName) { itemsContainer.innerHTML = '暫無資料'; return; }
    const savedHistory = localStorage.getItem('med_history_arr_' + currentMedName);
    if (!savedHistory) { itemsContainer.innerHTML = '這三天沒有紀錄喔。'; return; }

    let historyArr = JSON.parse(savedHistory);
    const nowMs = new Date().getTime(); const threeDaysMs = 3 * 24 * 60 * 60 * 1000;
    let recentPunches = historyArr.filter(ts => (nowMs - ts) <= threeDaysMs).sort((a, b) => b - a);

    if (recentPunches.length === 0) { itemsContainer.innerHTML = '最近 3 天沒有紀錄。'; return; }
    itemsContainer.innerHTML = recentPunches.map(ts => {
      const d = new Date(ts);
      return `<div class="history-item">🗓️ ${d.toLocaleDateString([], {month: '2-digit', day: '2-digit'})} 於 ${d.toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'})} 服用</div>`;
    }).join('');
  }

  function updateStatusDisplay() {
    const noticeDiv = document.getElementById('med-notice');
    const statusDiv = document.getElementById('status-container');
    if (!currentMedName) {
      noticeDiv.innerText = '請先新增藥品。'; statusDiv.innerHTML = '無藥品資料。'; return;
    }
    
    const currentMed = medications.find(m => m.name === currentMedName);
    noticeDiv.innerText = currentMed.notice ? currentMed.notice : '無特別注意事項。';
    
    const savedHistory = localStorage.getItem('med_history_arr_' + currentMedName);
    let historyArr = savedHistory ? JSON.parse(savedHistory) : [];
    
    if (historyArr.length === 0) {
      statusDiv.innerHTML = `<strong>【${currentMed.icon || '💊'} ${currentMedName}】</strong><br>目前沒有紀錄喔！`;
      if(showHistory) renderHistoryList(); return;
    }
    
    const lastPunchTime = new Date(historyArr[historyArr.length - 1]);
    const nextTime = new Date(lastPunchTime.getTime() + currentMed.interval * 60 * 60 * 1000);
    const now = new Date();
    
    let timeText = `⏱️ 上次吃藥：${lastPunchTime.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}<br>`;
    timeText += `🔔 下次預計：${nextTime.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})} (${getFrequencyText(currentMed.interval)}後)<br>`;
    
    if (now >= nextTime) {
      timeText += `<span class="alert">⚠️ 已經超過時間，可以吃藥囉！</span>`;
    } else {
      const diffMins = Math.ceil((nextTime - now) / (1000 * 60));
      if (diffMins > 60) {
        timeText += `<span class="ok">✅ 再過 ${Math.floor(diffMins / 60)} 小時 ${diffMins % 60} 分鐘才可以吃。</span>`;
      } else {
        timeText += `<span class="ok">✅ 再過 ${diffMins} 分鐘才可以吃。</span>`;
      }
    }
    statusDiv.innerHTML = `<strong>【${currentMed.icon || '💊'} ${currentMedName}】</strong><br>` + timeText;
    if (showHistory) renderHistoryList();
  }

  window.onload = initSystem; setInterval(updateStatusDisplay, 60000);
</script>
</body>
</html>
